<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 12.5 500 500" role="img" aria-label="ProjekTeam" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --pt-navy:  #273356;   /* Projek, top-left node            */
      --pt-blue:  #2D8CCB;   /* Team, checkmark, top-right node   */
      --pt-teal:  #68A9B4;   /* left node                         */
      --pt-light: #84B5D0;   /* bottom node                       */
      --pt-frame: #74A9C6;   /* thin frame lines behind the check */
    }
    .navy  { fill: var(--pt-navy,  #273356); }
    .blue  { fill: var(--pt-blue,  #2D8CCB); }
    .teal  { fill: var(--pt-teal,  #68A9B4); }
    .light { fill: var(--pt-light, #84B5D0); }
    .frame { stroke: var(--pt-frame, #74A9C6); }
    .ln    { fill: none; stroke-linecap: butt; }
  </style>
  <defs>
    <linearGradient id="g-navy-teal" gradientUnits="userSpaceOnUse" x1="146" y1="133" x2="109" y2="352">
      <stop offset="0"   stop-color="#273356"/>
      <stop offset="0.35" stop-color="#1E4A6C"/>
      <stop offset="1"   stop-color="#14516C"/>
    </linearGradient>
    <linearGradient id="g-navy-blue" gradientUnits="userSpaceOnUse" x1="142" y1="134" x2="368" y2="185">
      <stop offset="0"   stop-color="#273356"/>
      <stop offset="0.5" stop-color="#15546F"/>
      <stop offset="1"   stop-color="#1D719E"/>
    </linearGradient>
    <linearGradient id="g-stem" gradientUnits="userSpaceOnUse" x1="470" y1="80" x2="285" y2="263">
      <stop offset="0"   stop-color="#2D8CCB"/>
      <stop offset="1"   stop-color="#3A9AD3"/>
    </linearGradient>
    <linearGradient id="g-teal-light" gradientUnits="userSpaceOnUse" x1="105" y1="352" x2="321" y2="445">
      <stop offset="0"   stop-color="#68A9B4"/>
      <stop offset="1"   stop-color="#84B5D0"/>
    </linearGradient>
  </defs>
  <g id="mark">
    <!-- thin frame lines (behind everything) -->
    <g class="ln frame" stroke-width="18" stroke-linejoin="round">
      <path d="M441 178 V384 L312 446"/>
      <path d="M236 318 L221 416"/>
    </g>
    <!-- node connectors -->
    <g class="ln" stroke-width="20">
      <path d="M146 133 L109 352"  stroke="url(#g-navy-teal)"/>
      <path d="M142 134 L368 185"  stroke="url(#g-navy-blue)"/>
      <path d="M105 352 L321 445"  stroke="url(#g-teal-light)" stroke-width="18"/>
    </g>
    <!-- stem from the top-right node down to the check -->
    <path class="ln" d="M470 80 L285 263" stroke="url(#g-stem)" stroke-width="19"/>
    <!-- checkmark -->
    <path class="blue" d="M217 230 L183 257 L305 400 L474 162 L443 172 L302 318 Z" stroke="#2D8CCB" stroke-width="2" stroke-linejoin="round"/>
    <!-- nodes -->
    <circle class="navy"  cx="142.5" cy="133" r="42"/>
    <circle class="blue"  cx="470.5" cy="80"  r="43"/>
    <circle class="teal"  cx="105"   cy="352" r="43"/>
    <circle class="light" cx="321.5" cy="445" r="43"/>
  </g>

  <!-- ===== WORDMARK (outlined, Source Sans 3 Semibold) ===== -->
</svg>
